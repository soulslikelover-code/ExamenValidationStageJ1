<div class="client-hero">
  <div class="client-card">
    <div class="client-greeting">Espace client</div>
    <h1 class="client-title">Besoin d'aide ?</h1>
    <p class="client-desc">
      Notre équipe d'agents est disponible pour vous. Lancez un appel et nous vous répondons rapidement.
    </p>

    <button class="btn btn-primary call-button" (click)="lancerAppel()">
      📞 Lancer un appel
    </button>

    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.06);">
      <a routerLink="/" class="btn btn-secondary" style="width:100%; justify-content:center;">
        Se déconnecter
      </a>
    </div>
  </div>
</div>
