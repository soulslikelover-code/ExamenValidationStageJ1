<div class="auth-page">
  <div class="auth-container">
    <a routerLink="/" class="auth-back">Retour à l'accueil</a>

    <div class="auth-logo">
      <div class="auth-logo-text">E<span>·</span>Call</div>
    </div>

    <div class="auth-card">
      <div class="role-badge role-admin">⚡ Espace administrateur</div>
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-subtitle">Accédez au panneau d'administration</p>

      <div class="form-group">
        <label class="form-label">Adresse email</label>
        <input type="email" [(ngModel)]="email" class="form-control" placeholder="admin@exemple.com">
      </div>

      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" [(ngModel)]="motDePasse" class="form-control" placeholder="••••••••">
      </div>

      <button class="btn btn-primary btn-block" (click)="connecter()">Se connecter</button>

      <p class="message" [class.success]="message === 'Connexion réussie'">{{ message }}</p>
    </div>
  </div>
</div>
