<div class="auth-page">
  <div class="auth-container">
    <a routerLink="/" class="auth-back">Retour à l'accueil</a>

    <div class="auth-logo">
      <div class="auth-logo-text">E<span>·</span>Call</div>
    </div>

    <div class="auth-card">
      <div class="role-badge role-client">✓ Espace client</div>
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-subtitle">Bienvenue, connectez-vous à votre espace</p>

      <div class="form-group">
        <label class="form-label">Adresse email</label>
        <input type="email" [(ngModel)]="email" class="form-control" placeholder="vous@exemple.com">
      </div>

      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" [(ngModel)]="motDePasse" class="form-control" placeholder="••••••••">
      </div>

      <button class="btn btn-primary btn-block" (click)="connecter()">Se connecter</button>

      <p class="message">{{ message }}</p>

      <div class="auth-divider"><span>ou</span></div>
      <div class="auth-footer">
        Pas encore de compte ? <a routerLink="/inscription">S'inscrire</a>
      </div>
    </div>
  </div>
</div>
